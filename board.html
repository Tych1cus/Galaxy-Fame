<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Galaxy Fame — leaderboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#070a14;--pn:#0e1424;--ln:#1e2740;--tx:#e8eefc;--mu:#93a1c4;--gd:#ffd36a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 70% -10%,#18234a 0%,#070a14 60%);
background-color:#070a14;min-height:100vh;color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:26px 20px 6px;max-width:720px;margin:0 auto}
h1{margin:0;font-size:24px}
.sub{color:var(--mu);font-size:13px;margin-top:5px}
main{max-width:720px;margin:0 auto;padding:8px 20px 70px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-top:14px}
label{display:block;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
input{width:100%;background:#0a1020;border:1px solid var(--ln);color:var(--tx);
border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit}
input:focus{outline:none;border-color:var(--gd)}
button{background:linear-gradient(180deg,#ffd36a,#ff9f4a);color:#20160a;border:0;border-radius:10px;
padding:10px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:10px}
button.ghost{background:#141c30;color:var(--tx);border:1px solid var(--ln);font-weight:600}
button:disabled{opacity:.55;cursor:default}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--ln)}
th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:600}
td.pos{color:var(--mu);width:34px}
td.fame{text-align:right;font-weight:700;color:var(--gd);white-space:nowrap}
td.title{color:var(--mu);font-size:12.5px}
.me{background:#132038}
.msg{font-size:13px;margin-top:10px;color:var(--mu)}
.msg.err{color:#ff8f8f}
.foot{color:var(--mu);font-size:12px;margin-top:24px;border-top:1px solid var(--ln);padding-top:12px}
a{color:var(--gd)}
.tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ptabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.ptabs button{margin:0;padding:6px 11px;font-size:13px}
.tabs button{margin:0}
td.win{color:var(--gd)}
</style></head><body>
<header>
<h1>✦ Galaxy Fame leaderboard</h1>
<div class="sub" id="sub">Best runs</div>
</header>
<main>

<div class="card">
  <label>Your name</label>
  <input id="nm" maxlength="16" placeholder="e.g. Kevin" autocomplete="off">
  <div class="msg" id="msg"></div>
</div>

<div class="tabs">
  <button id="tToday" onclick="tab('today')">Today</button>
  <button id="tAll" class="ghost" onclick="tab('all')">All time</button>
  <button id="tLJ" class="ghost" onclick="tab('lj')">💀 Leeroy Jenkins</button>
</div>
<div class="ptabs" id="ptabs"></div>

<div class="card">
  <table id="tbl"><tbody id="rows"><tr><td colspan="4" class="msg">Loading…</td></tr></tbody></table>
</div>

<div class="foot">
  <a href="index.html">← Back to the game</a> · Ranked by total fame earned in a run (your final score). Each prestige level has its own board: a run counts on its own level and every level below it. Each player's best run counts.
</div>
</main>
<script>
var LB_URL='https://bbawfdqrxqfeqadcfdqj.supabase.co',LB_KEY='sb_publishable_owcLW7JcSGVvUIcfvNYRuQ_G0arZB9Z';
var LB_BAD=['fuck','shit','bitch','cunt','nigg','fagg','slut','whore','rape','nazi','hitler','dick','cock','pussy','asshole','retard'];
var ME='',TAB='today',PL=0,PMAX=10,DVM=/[?&]mode=devious/.test(location.search),TBL=DVM?'gf_dv_scores':'gf_scores';
if(DVM){document.title='Galaxy Fame — Devious Mode leaderboard';document.querySelector('h1').textContent='😈 Devious Mode leaderboard';var bk=document.querySelector('.foot a');bk.href='devious.html';bk.textContent='← Back to Devious Mode'}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cleanName(s){return String(s||'').replace(/[^A-Za-z0-9 _.\-]/g,'').replace(/\s+/g,' ').trim().slice(0,16)}
function nameOk(s){var t=s.toLowerCase().replace(/[^a-z]/g,'');return LB_BAD.every(function(w){return t.indexOf(w)<0})}

function paint(rows){
  var b=document.getElementById('rows');
  if(!rows||!rows.length){b.innerHTML='<tr><td colspan="4" class="msg">'+(TAB=='today'?'Nobody has finished a run today yet. Be first.':'No runs yet. Be first.')+'</td></tr>';return}
  b.innerHTML=rows.map(function(r,i){
    var g=r.goals>=10?'🏆 won':(r.goals||0)+' goal'+(r.goals==1?'':'s');
    return '<tr class="'+(ME&&r.name.toLowerCase()===ME.toLowerCase()?'me':'')+'"><td class="pos">'+(i+1)+'</td>'+
      '<td>'+esc(r.name)+'<div class="title">'+esc(String(r.title||'').replace(/ · played P\d+/,''))+(r.p?' · played P'+r.p:'')+(TAB=='all'?' · '+esc(r.day):'')+'</div></td>'+
      '<td class="fame">'+Number(r.fame).toLocaleString()+' ⭐</td>'+
      '<td class="title'+(r.goals>=10?' win':'')+'" style="text-align:right">'+g+'</td></tr>'
  }).join('');
}

async function loadLJ(){
  document.getElementById('sub').textContent='Highest Leeroy Jenkins level each player has won a run at';
  document.getElementById('ptabs').innerHTML='';
  var b=document.getElementById('rows');
  try{
    var r=await fetch(LB_URL+'/rest/v1/gf_lj?select=name,lj,updated_at&order=lj.desc,updated_at.asc&limit=100',{cache:'no-store',headers:{apikey:LB_KEY,Authorization:'Bearer '+LB_KEY}});
    if(!r.ok)throw new Error(r.status==404?'the Leeroy board is not set up in the database yet':'HTTP '+r.status);
    var rows=await r.json();
    if(!rows.length){b.innerHTML='<tr><td colspan="4" class="msg">Nobody has won a Leeroy Jenkins run yet. Be first.</td></tr>';return}
    b.innerHTML=rows.map(function(x,i){return '<tr class="'+(ME&&x.name.toLowerCase()===ME.toLowerCase()?'me':'')+'"><td class="pos">'+(i+1)+'</td><td>'+esc(x.name)+'<div class="title">since '+esc(String(x.updated_at||'').slice(0,10))+'</div></td><td class="fame">💀 Level '+x.lj+'</td><td></td></tr>'}).join('');
  }catch(e){b.innerHTML='<tr><td colspan="4" class="msg err">Could not load the Leeroy board: '+esc(e.message)+'</td></tr>'}
}
async function load(){
  if(TAB=='lj')return loadLJ();
  var pn=PL?'Prestige '+PL:'Normal';
  document.getElementById('sub').textContent=(TAB=='today'?'Best runs today ('+today()+')':'Best runs of all time')+' · '+pn+(PL<PMAX?' (runs at '+pn.replace('Prestige ','P')+' or higher)':'');
  ptabs();
  try{
    var q=LB_URL+'/rest/v1/'+TBL+'?select=name,day,goals,fame,win,title,p&order=fame.desc&limit=500'+(TAB=='today'?'&day=eq.'+today():'')+'&p=gte.'+PL;
    var r=await fetch(q,{cache:'no-store',headers:{apikey:LB_KEY,Authorization:'Bearer '+LB_KEY}});
    if(!r.ok&&r.status==400){ // database not updated for prestige boards yet
      r=await fetch(q.replace('title,p&','title&').replace('&p=gte.'+PL,''),{cache:'no-store',headers:{apikey:LB_KEY,Authorization:'Bearer '+LB_KEY}});}
    if(!r.ok)throw new Error('HTTP '+r.status);
    var rows=await r.json(),seen={},out=[];
    rows.forEach(function(x){var k=x.name.toLowerCase();if(x.name=='Anon'||!seen[k]){seen[k]=1;out.push(x)}});   // one row per player
    paint(out.slice(0,100));
  }catch(e){
    document.getElementById('rows').innerHTML='<tr><td colspan="4" class="msg err">Could not reach the board. '+esc(e.message)+'</td></tr>';
  }
}
function ptabs(){var h='';for(var i=0;i<=PMAX;i++)h+='<button class="'+(i==PL?'':'ghost')+'" onclick="ptab('+i+')">'+(i?'P'+i:'Normal')+'</button>';document.getElementById('ptabs').innerHTML=h}
function ptab(i){PL=i;load()}
function tab(t){TAB=t;document.getElementById('tToday').className=t=='today'?'':'ghost';document.getElementById('tAll').className=t=='all'?'':'ghost';document.getElementById('tLJ').className=t=='lj'?'':'ghost';load()}

function saveName(){
  var v=cleanName(document.getElementById('nm').value),m=document.getElementById('msg');
  if(v.length<2){m.className='msg err';m.textContent='Pick a name with at least 2 letters or numbers.';return}
  if(!nameOk(v)){m.className='msg err';m.textContent='Please pick a different name.';return}
  ME=v;document.getElementById('nm').value=v;try{localStorage.setItem('gf_name',v)}catch(e){}
  m.className='msg';m.textContent='Saved. Your next runs will show as "'+v+'".';load();
}

(function(){
  try{ME=cleanName(localStorage.getItem('gf_name')||'')}catch(e){}
  try{var m=JSON.parse(localStorage.getItem('startithe_meta')||'null');if(m)PL=Math.max(0,Math.min(PMAX,Math.min(m.prestige||0,m.plvl||0)))}catch(e){}  // open on the prestige you're playing
  document.getElementById('nm').value=ME;
  document.getElementById('nm').addEventListener('change',saveName);
  load();
  setInterval(load,30000);
})();
</script></body></html>
